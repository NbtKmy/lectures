  <div class="map-ui">
    <label for="minutes-task3">Walking time</label>
    <span class="range">
      <input id="minutes-task3" type="range" min="10" max="30" step="10" value="30" aria-describedby="readout-task3">
      <span class="ticks" aria-hidden="true"><span>10 min</span><span>20</span><span>30</span></span>
